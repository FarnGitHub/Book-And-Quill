plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.2-SNAPSHOT'
}

group = project.property('group')
version = project.property('version')
base {
    archivesName = project.property('modid')
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
    maven { url 'https://maven.wagyourtail.xyz/releases' }

    ivy {
        // We need this because the b1.7.3 forge dependency doesn't have metadata
        url 'https://maven.wagyourtail.xyz/releases'

        patternLayout {
            artifact('[organisation]/[module]/[revision]/[module]-[revision]-[classifier].zip')
            m2compatible = true
        }
        metadataSources {
            artifact()
        }
    }
}

unimined {
    minecraft {
        version 'b1.7.3'
        side 'client'

        mappings {
            retroMCP("b1.7")

            stubs(['official', 'retroMCP']) {
                def base = 'net/minecraft/src'
                def mapClass = { name ->
                    def path = "$base/$name"
                    c(name, path, path)
                }
                // Modloader
                ['mod_BookAndQuill', 'BaseMod', 'EntityRendererProxy', 'MLProp', 'ModLoader', 'ModTextureAnimation', 'ModTextureStatic'].each(mapClass)

                ['GuiApiHelper', 'ModSettingScreen', 'Setting', 'SettingBoolean', 'Widget', 'WidgetBoolean'].each(mapClass)

            }
        }

        jarMod {
        }
    }
}

dependencies {
    jarMod 'risugami:modloader:b1.7.3'
    jarMod 'modloadermp:modloadermp:b1.7.3:client'
    jarMod 'net.minecraftforge:forge:b1.7.3-1.0.7:client'
    jarMod files('jarmods/b1.7.3_ItemNBT_1.3.zip')
    jarMod files('jarmods/GuiAPI0.11.0-1.7.zip')
}
